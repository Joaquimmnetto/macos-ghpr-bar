def unix755 = Set.of(
    PosixFilePermission.OWNER_READ,
    PosixFilePermission.OWNER_WRITE,
    PosixFilePermission.OWNER_EXECUTE,
    PosixFilePermission.GROUP_READ,
    PosixFilePermission.GROUP_EXECUTE,
    PosixFilePermission.OTHERS_READ,
    PosixFilePermission.OTHERS_EXECUTE
)

def ghBarBundleIdentifier = (project.findProperty("ghBarBundleIdentifier") ?: "com.joaquimmnetto.ghbar").toString()
def ghBarVersion = (project.findProperty("ghBarVersion") ?: "1.0.0").toString()
def ghBarBuildVersion = (project.findProperty("ghBarBuildVersion") ?: ghBarVersion).toString()

def renderInfoPlist = { String template ->
    template
        .replace('@ghBarBundleIdentifier@', ghBarBundleIdentifier)
        .replace('@ghBarVersion@', ghBarVersion)
        .replace('@ghBarBuildVersion@', ghBarBuildVersion)
}

// -PgoArch=universal|arm64|amd64 (default: universal)
def goArchModes = ['universal', 'arm64', 'amd64'] as Set
def goArch = (project.findProperty("goArch") ?: "universal").toString()
if (!goArchModes.contains(goArch)) {
    throw new GradleException(
        "Invalid goArch '${goArch}'. Use one of: ${goArchModes.join(', ')}"
    )
}

def hostMachineArchProvider = providers.exec {
    commandLine 'uname', '-m'
}.standardOutput.asText.map { output ->
    switch (output.trim()) {
        case "arm64": return "arm64"
        case "x86_64": return "amd64"
        default:
            throw new GradleException("Unsupported host CPU: ${output.trim()}")
    }
}

def clangArchFlag = { String goArchName ->
    goArchName == "arm64" ? "arm64" : "x86_64"
}

def goCgoEnvironment = { String hostArch, String targetGoArch ->
    def env = [
        'GOOS': 'darwin',
        'GOARCH': targetGoArch,
        'CGO_ENABLED': '1',
    ]
    if (hostArch != targetGoArch) {
        def archFlag = clangArchFlag(targetGoArch)
        env['CC'] = 'clang'
        env['CXX'] = 'clang++'
        env['CGO_CFLAGS'] = "-arch ${archFlag}"
        env['CGO_CXXFLAGS'] = "-arch ${archFlag}"
        env['CGO_LDFLAGS'] = "-arch ${archFlag}"
    }
    return env
}

def goBinDir = layout.buildDirectory.dir("go")
def goBinArm64 = goBinDir.map { it.file("GhBar-arm64") }
def goBinAmd64 = goBinDir.map { it.file("GhBar-amd64") }
def finalGoBin = file("${projectDir.absolutePath}/app")

def applyGoCgoEnvironment = { task, String targetGoArch ->
    task.doFirst {
        def hostArch = hostMachineArchProvider.get()
        goCgoEnvironment(hostArch, targetGoArch).each { key, value ->
            task.environment key, value
        }
    }
}

def registerGoArchBuild = { String taskName, String targetGoArch, Provider<RegularFile> outputBin ->
    tasks.register(taskName, Exec) {
        group = "build"
        description = "Build GhBar for darwin/${targetGoArch} (CGO)"
        inputs.files(java.nio.file.Files.walk(projectDir.toPath())
                .filter { Files.isRegularFile(it)}
                .filter { it.toString().endsWith(".go") }
                .map    {it.toAbsolutePath().toFile() }
                .toList()
        )
        inputs.file(file("go.mod"))
        inputs.file(file("go.sum"))
        outputs.file(outputBin)
        doFirst {
            Files.createDirectories(outputBin.get().asFile.parentFile.toPath())
        }
        applyGoCgoEnvironment(delegate, targetGoArch)
        commandLine 'go', 'build', '-o', outputBin.get().asFile.absolutePath, '.'
    }
}

registerGoArchBuild("buildGoAppArm64", "arm64", goBinArm64)
registerGoArchBuild("buildGoAppAmd64", "amd64", goBinAmd64)

tasks.register("buildGoAppMaterializeArm64") {
    dependsOn 'buildGoAppArm64'
    inputs.file(goBinArm64)
    outputs.file(finalGoBin)
    doLast {
        Files.copy(
            goBinArm64.get().asFile.toPath(),
            finalGoBin.toPath(),
            StandardCopyOption.REPLACE_EXISTING
        )
        Files.setPosixFilePermissions(finalGoBin.toPath(), unix755)
    }
}

tasks.register("buildGoAppMaterializeAmd64") {
    dependsOn 'buildGoAppAmd64'
    inputs.file(goBinAmd64)
    outputs.file(finalGoBin)
    doLast {
        Files.copy(
            goBinAmd64.get().asFile.toPath(),
            finalGoBin.toPath(),
            StandardCopyOption.REPLACE_EXISTING
        )
        Files.setPosixFilePermissions(finalGoBin.toPath(), unix755)
    }
}

tasks.register("buildGoAppLipo", Exec) {
    dependsOn 'buildGoAppArm64', 'buildGoAppAmd64'
    inputs.files(goBinArm64, goBinAmd64)
    outputs.file(finalGoBin)
    doFirst {
        finalGoBin.delete()
    }
    commandLine 'lipo', '-create',
        goBinArm64.get().asFile.absolutePath,
        goBinAmd64.get().asFile.absolutePath,
        '-output', finalGoBin.absolutePath
    doLast {
        Files.setPosixFilePermissions(finalGoBin.toPath(), unix755)
    }
}

tasks.register("buildGoApp") {
    group = "build"
    description = "Build GhBar binary (-PgoArch=universal|arm64|amd64, default universal)"
    outputs.file(finalGoBin)
    switch (goArch) {
        case "universal":
            dependsOn 'buildGoAppLipo'
            break
        case "arm64":
            dependsOn 'buildGoAppMaterializeArm64'
            break
        case "amd64":
            dependsOn 'buildGoAppMaterializeAmd64'
            break
    }
    doLast {
        def execOps = services.get(ExecOperations)
        execOps.exec { spec ->
            spec.commandLine 'lipo', '-info', finalGoBin.absolutePath
        }
        logger.lifecycle "Built ${finalGoBin.absolutePath} (goArch=${goArch})"
    }
}

tasks.register("buildAppIcon") {
    group = "build"
    description = "Build AppIcon.icns from assets/AppIcon.png (macOS iconutil)"
    def sourceIcon = file("assets/AppIcon.png")
    def iconsetDir = layout.buildDirectory.dir("AppIcon.iconset")
    def icnsFile = layout.buildDirectory.file("AppIcon.icns")
    inputs.file(sourceIcon)
    outputs.file(icnsFile)
    doLast {
        if (!sourceIcon.exists()) {
            throw new GradleException("Missing ${sourceIcon.absolutePath}")
        }
        def execOps = services.get(ExecOperations)
        def iconset = iconsetDir.get().asFile
        iconset.deleteDir()
        iconset.mkdirs()

        [
            [file: "icon_16x16.png", px: 16],
            [file: "icon_16x16@2x.png", px: 32],
            [file: "icon_32x32.png", px: 32],
            [file: "icon_32x32@2x.png", px: 64],
            [file: "icon_128x128.png", px: 128],
            [file: "icon_128x128@2x.png", px: 256],
            [file: "icon_256x256.png", px: 256],
            [file: "icon_256x256@2x.png", px: 512],
            [file: "icon_512x512.png", px: 512],
            [file: "icon_512x512@2x.png", px: 1024],
        ].each { spec ->
            def dest = new File(iconset, spec.file)
            execOps.exec { execSpec ->
                execSpec.commandLine 'sips', '-z', spec.px.toString(), spec.px.toString(),
                    sourceIcon.absolutePath, '--out', dest.absolutePath
            }
        }

        icnsFile.get().asFile.delete()
        execOps.exec { execSpec ->
            execSpec.commandLine 'iconutil', '-c', 'icns', iconset.absolutePath,
                '-o', icnsFile.get().asFile.absolutePath
        }
        iconset.deleteDir()
    }
}

tasks.register("createAppFolder") {
    dependsOn 'buildGoApp', 'buildAppIcon'
    def appRoot = Path.of(projectDir.absolutePath, "GhBar.app")
    def appContentsPath = appRoot.resolve("Contents")
    def appResourcesPath = appContentsPath.resolve("Resources")
    def appBinFolder = appContentsPath.resolve("MacOS")
    def appBinFile = appBinFolder.resolve("GhBar")
    def appConfigFile = appBinFolder.resolve("config.yml")
    def appPlistFile = appContentsPath.resolve("Info.plist")
    def appIconFile = appResourcesPath.resolve("AppIcon.icns")
    def binFile = file("app")
    def configFile = file("config.yml")
    def plistFile = file("Info.plist")
    def icnsFile = layout.buildDirectory.file("AppIcon.icns")
    doFirst {
        appRoot.toFile().deleteDir()
    }
    doLast {
        Files.createDirectories(appResourcesPath)
        Files.createDirectories(appBinFolder)
        Files.copy(binFile.toPath(), appBinFile, StandardCopyOption.REPLACE_EXISTING)
        Files.copy(configFile.toPath(), appConfigFile, StandardCopyOption.REPLACE_EXISTING)
        Files.copy(icnsFile.get().asFile.toPath(), appIconFile, StandardCopyOption.REPLACE_EXISTING)
        def plistBody = renderInfoPlist(plistFile.getText("UTF-8"))
        Files.writeString(appPlistFile, plistBody)
        Files.setPosixFilePermissions(appRoot, unix755)
    }
}

tasks.register("signApp", Exec) {
    dependsOn 'createAppFolder'
    def appRoot = Path.of(projectDir.absolutePath, "GhBar.app").toString()
    def entitlementsFile = file("${projectDir.absolutePath}/entitlements.plist")
    def identity = project.findProperty("signingIdentity") ?: "-"
    commandLine 'codesign',
        '--force',
        '--options', 'runtime',
        '--sign', identity,
        '--entitlements', entitlementsFile.absolutePath,
        '--timestamp',
        appRoot
    doFirst {
        if (identity == "-") {
            logger.warn "No signingIdentity property set — signing with ad-hoc identity ('-'). " +
                "Pass -PsigningIdentity='Developer ID Application: Your Name (TEAMID)' for distribution."
        } else {
            logger.info "Signing GhBar.app with identity: ${identity}"
        }
    }
}

tasks.register("installApp", Copy) {
    dependsOn 'createAppFolder'
    doFirst {
        def target = Path.of(System.getProperty("user.home"), "Applications", "GhBar.app").toFile()
        target.deleteDir()
        logger.info "Installing to ${target.absolutePath}"
    }
    from "${projectDir.absolutePath}/GhBar.app"
    into "~/Applications/GhBar.app"
}
